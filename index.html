<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Personen-Gedächtnis</title>
  <meta name="theme-color" content="#4f6ef7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Personen">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Personen-Gedächtnis</h1>
    <span id="sync-status" class="sync-status" title="Google-Drive-Status">●</span>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button data-tab="assistant" class="tab active">
      <span class="tab-icon">🎤</span><span>Assistent</span>
    </button>
    <button data-tab="persons" class="tab">
      <span class="tab-icon">👥</span><span>Personen</span>
    </button>
    <button data-tab="birthdays" class="tab">
      <span class="tab-icon">🎂</span><span>Geburtstage</span>
    </button>
    <button data-tab="settings" class="tab">
      <span class="tab-icon">⚙️</span><span>Einstellungen</span>
    </button>
  </nav>

  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
